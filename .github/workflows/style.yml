name: Code Style

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install Dependencies
        run: pip3 install ruff
      - name: ruff format check
        run: ruff format --check --diff service *.py
      - name: ruff linter
        run: ruff check service *.py
